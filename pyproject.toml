[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbus"
version = "0.1.0.dev0"
description = "Transparent transport of opaque payloads plus inspectable metadata: same process, same machine, other machines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Genropy Team", email = "info@softwell.it"}
]
keywords = ["asyncio", "ipc", "websocket", "unix-socket", "rpc", "streaming"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]

dependencies = [
    "websockets>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    # tests/scenarios drives a minimal HTTP gateway from a real client.
    "httpx>=0.27",
]
dev = [
    "kbus[test]",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Repository = "https://github.com/kajenn-org/kajenn-kbus"
"Bug Tracker" = "https://github.com/kajenn-org/kajenn-kbus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=kbus --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]
